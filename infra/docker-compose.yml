# Run from repo root:  cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.yml --env-file infra/.env up --build -d
name: deadmansdraw
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saloon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: saloon
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saloon -d saloon"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build: { context: .., dockerfile: infra/Dockerfile, target: server }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://saloon:${POSTGRES_PASSWORD}@postgres:5432/saloon
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      DATA_DIR: /data
    volumes: [serverdata:/data]
    expose: ["2567"]
  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        VITE_SERVER_URL: ${PUBLIC_WS_URL:-ws://localhost}
    restart: unless-stopped
    depends_on:
      server: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
volumes:
  pgdata:
  serverdata:
  caddy_data:
  caddy_config:
